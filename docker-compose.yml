version: '3.8'

services:
  openTerminal:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/api/proxy/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
